      <h2>Contacto</h2>
      <p>¿Una pregunta? Escríbame a <a href="mailto:cartelface@gmail.com">cartelface@gmail.com</a> o utilice el formulario.</p>

      <form action="mailto:cartelface@gmail.com" method="post" enctype="text/plain">
        <label for="nom">Nombre</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
